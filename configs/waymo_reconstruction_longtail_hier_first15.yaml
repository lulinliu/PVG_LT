exhaust_test: false

# ModelParams
scene_type: "Waymo"
resolution_scales: [1, 2, 4, 8, 16]
cam_num: 3
start_frame: 0
end_frame: -1
eval: false
num_pts: 600000
t_init: 0.1
separate_scaling_t: 0.2

# OptimizationParams
iterations: 30000
opacity_lr: 0.005
densify_until_iter: 15000
densify_grad_threshold: 0.00017
sh_increase_interval: 2000
lambda_v_reg: 0.01
lambda_dssim: 0.2

# Hierarchical long-tail reconstruction for first15
hierarchical_longtail: true
lt_pool_init_threshold: 0.5
lt_pool_fallback_topk: 4096
lt_init_min_views: 1
lt_init_scale_quantile: 1.0
lt_reinit_features: false
lt_reinit_dc_value: 0.0
lt_init_opacity: 0.01
lt_init_scale_shrink: 1.0
bg_loss_weight: 1.0
lt_loss_weight: 2.0
final_loss_weight: 1.0
bg_suppress_in_lt_weight: 2.0
lt_suppress_outside_weight: 2.0
bg_lambda_self_supervision: 0.5
lt_branch_t_init: 0.02
lt_branch_gate_span_factor: 0.5
lt_densify_until_num_points: 250000
lt_regularization_max_points: 120000
lt_target_mode: "foreground"
lt_support_threshold: 0.0
lt_support_dilate_px: 0
lt_core_erode_px: 0
lt_ring_weight: 0.0
lt_crop_loss_weight: 0.0
lt_scale_penalty_weight: 0.0

lt_activate_max_scale: 1
lt_frame_local_only: false
lt_prob_threshold: 0.5
lt_min_obs: 3
lt_current_mask_threshold: 0.5
lt_min_obs_before_prune: 6
lt_mask_dilate_px: 0
lt_rgb_weight: 1.5
lt_mask_weight: 2.0
lt_sparse_weight: 0.0003
lt_gate_weight: 0.01
lt_gate_max_span_factor: 1.5
lt_motion_smooth_weight: 0.002
lt_prune_opacity_factor: 1.0
lt_densify_grad_factor: 1.0
lt_positive_weight_cap: 12
lt_sampling_boost: 2.0
